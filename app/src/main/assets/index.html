function mk(c,sex){const le=sex?c.f:c.m,x=Math.max(0,(c.u-c.i)/(1000-c.i)/1000),q4=1-Math.pow(1-x,.25);let lo=1e-7,hi=.1,q;

else if(a<5)o=[['пневмония',1+p*3],['диарея',p*2.5],['малярия',p*2],['недоедание',p*2],['несчастный случай',1],['врождённая болезнь',1]];
else if(a<15)o=[['инфекция',.5+p*2],['несчастный случай',2],['болезнь',1.5],['утопление',1]];
else if(a<40)o=[['несчастный случай или травма',2],['насилие',c.h/3],['болезнь',1.5],['ВИЧ-связанная болезнь',c.v*3],['осложнения беременности и родов',sx?c.r/150:0],['инфекция',p*2]];

L={c,sex,odds:T/w[i],pr:w[i]/T*100,q,le:sex?c.f:c.m,age:0,h:80,j:70,m:50,b:60,z0,z1:rn(),sg,edu:0,busy:0,mm:1,ret:0,pen:0,job:null,ten:0,f:'bal',sum:0,wy:0,cap:0,rate:.03,log:[],lid:0,maj:[],mk:{},jy:[],hist:[],fc:{},dead:0,home:c.n,nm:nm(sex),sk:R()*5|0,
 q5:Math.min(5,Math.ceil(Ph(z0)*5)||1),urb:R()*100<(c.ur??55),sib:Math.max(0,Math.round(c.t*(.5+R())-1)),mo:19+(R()*19|0),pt:null,kids:[],pz:1,hide:0,ff:0,need:0,notes:0};

paused=false;pend=null;auto=auto;armed=null;
roul(i)}
function roul(j){const a=$('#app');a.innerHTML=`<div class=rl><div class=mo>ОПРЕДЕЛЯЕТСЯ МЕСТО РОЖДЕНИЯ</div><div class="sf hero" id=rn style="font-size:clamp(34px,11vw,56px)"> </div><div class=mo id=rp></div></div>`;
